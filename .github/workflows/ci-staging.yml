name: CI → Staging

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  REGISTRY: mgsacr.azurecr.io
  BACKEND_IMAGE: mgs-backend
  WORKER_IMAGE: mgs-worker

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff mypy
      - run: ruff check backend/
      - run: mypy backend/app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: mgs, POSTGRES_PASSWORD: mgs_secret, POSTGRES_DB: mgs_test }
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U mgs" --health-interval=5s --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest tests/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://mgs:mgs_secret@localhost:5432/mgs_test
          REDIS_URL: redis://localhost:6379/0

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: azure/docker-login@v2
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - run: |
          docker build -t $REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA -f backend/Dockerfile backend/
          docker build -t $REGISTRY/$WORKER_IMAGE:$GITHUB_SHA -f backend/Dockerfile.worker backend/
          docker push $REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA
          docker push $REGISTRY/$WORKER_IMAGE:$GITHUB_SHA

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}
      - run: |
          kubectl set image deployment/mgs-backend backend=$REGISTRY/$BACKEND_IMAGE:$GITHUB_SHA -n mgs-staging
          kubectl set image deployment/mgs-worker worker=$REGISTRY/$WORKER_IMAGE:$GITHUB_SHA -n mgs-staging
          kubectl rollout status deployment/mgs-backend -n mgs-staging --timeout=300s
