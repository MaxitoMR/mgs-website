apiVersion: apps/v1
kind: Deployment
metadata:
  name: mgs-backend
  namespace: mgs-app
spec:
  replicas: 3
  selector:
    matchLabels: { app: mgs-backend }
  template:
    metadata:
      labels: { app: mgs-backend }
    spec:
      containers:
        - name: backend
          image: mgsacr.azurecr.io/mgs-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: mgs-config }
            - secretRef: { name: mgs-secrets }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1000m", memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
