apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mgs-app.fullname" . }}-config
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  DD_SERVICE: {{ .Values.config.ddService | quote }}
  DD_ENV: {{ .Values.config.ddEnv | quote }}
  TEMPORAL_HOST: {{ .Values.config.temporalHost | quote }}
  BLOB_PROVIDER: {{ .Values.config.blobProvider | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
