apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mgs-app.fullname" . }}-backend
  labels: {{- include "mgs-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels: { app: mgs-backend }
  template:
    metadata:
      labels: { app: mgs-backend }
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.backend.service.targetPort }} }]
          envFrom:
            - configMapRef: { name: {{ include "mgs-app.fullname" . }}-config }
            - secretRef: { name: {{ include "mgs-app.fullname" . }}-secrets }
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: {{ .Values.backend.service.targetPort }} }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: {{ .Values.backend.service.targetPort }} }
            initialDelaySeconds: 15
